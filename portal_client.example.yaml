# 复制为 portal_client.yaml 后，按本人已授权的门户页面校准。
#
# 只在本机运行，不要提交这个文件（含个人门户路径与服务器地址）。

# 登录方式：http = 直接提交官方 CAS 表单（推荐，绕过自动化下空白的登录 iframe）
#           browser = Playwright 打开 Edge 人工登录
login:
  mode: http
  timeout: 25
  username: ""            # 可留空，改用 --save-credentials 加密保存
  password: ""
  credentials_file: secrets/portal.enc
  key_file: secrets/portal.key

# browser 模式使用的浏览器：默认 Edge；browser_path 可填绝对路径。
browser: edge
# browser_path: "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"

base: http://my.bupt.edu.cn
login_timeout: 600        # browser 模式等待人工登录的秒数
identity_selector: ".topinner"   # 登录后才会出现的身份区域，用于确认已登录

lists:
  - name: "通知公告"
    url: "http://my.bupt.edu.cn"      # 通知列表所在页面；也可填具体列表 URL
    row_selector: "ul.newslist > li"
    link_selector: "a"
    date_selector: ""        # 留空则从行文本里提取日期
    source_selector: ""      # 留空则用栏目名作为发布部门
    body_selector: "#vsb_content .v_news_content"

  # 需要多个栏目时照此追加；name 会作为通知的“发布部门/栏目”。
  # - name: "科研院"
  #   url: "http://my.bupt.edu.cn/..."
  #   row_selector: "ul.newslist > li"
  #   link_selector: "a"
  #   body_selector: "#vsb_content .v_news_content"

# tools/portal_sync.py 用这一段完成上传与服务器导入。
server:
  host: "your-server"            # 服务器地址或域名
  user: "ubuntu"
  port: 22
  app_dir: /opt/bupt-insight/app
  inbox: /var/lib/bupt-insight/portal-inbox
  python: /opt/bupt-insight/venv/bin/python
  service_user: bupt
  import_args: []                # 例如 ["--push"]
