# 密码和推送密钥通过 credentials 命令写入 Windows Credential Manager。
owner:
  tz: Asia/Shanghai
net:
  browser: edge
  executable_path: ""
  timeout_ms: 30000
  retries: 2
  delay_ms: 2500
paths:
  session_dir: .local/sessions
  data_dir: .local/data
  inbox_dir: .local/inbox
sources:
  portal:
    enabled: true
    base: http://my.bupt.edu.cn
    auth_mode: browser   # browser / http / auto；实际账号认证均待验证
    session: portal_state.bin
    manual_wait_seconds: 180
    identity_selector: ""   # 登录后账号身份区域，必须校准
    identity_expected_text: "" # 可选的账号标记；不要填写密码
    business_selector: ""   # 仅登录后可见的业务内容区域，必须校准
    frame_selector: ""      # 如果通知在 iframe 中，填写其选择器
    rows_per_list: 20
    # 尚未获取账号下的真实列表，禁止填写虚构接口冒充可用适配器。
    lists: []
  byr:
    enabled: true
    base: https://bbs.byr.cn
    session: byr_state.bin
    requires_login: true
    private: false # 若关注私人版面，请设 true，禁止向第三方发送正文与链接
    watchlist: watchlist.json
    boards: [Paper, ML_DM, Robot, SICE, ParttimeJob, MathModel, Innovation, ACM_ICPC, AcademicAffairs, SCS]
    rows_per_board: 10
    board_overrides:
      Paper: {pages: 3, rows_per_page: 30}
push:
  retries: 3
  channels:
    pushplus: {enabled: false}
    serverchan: {enabled: false}
    desktop: {enabled: true}
backup:
  enabled: true
  interval_hours: 24
  keep: 7
health:
  stale_hours: 24
ai:
  mode: "off" # off=不调用模型；mock=模拟规则；api=真实OpenAI兼容API
  base_url: "" # 例如本人部署的 http://127.0.0.1:8000/v1；外部服务必须HTTPS
  model: "" # 可由 LLM_MODEL 覆盖；base_url可由 LLM_BASE_URL覆盖
  response_format: json_schema # 不支持schema的服务可显式改json_object，仍严格本地校验
  timeout_seconds: 8
  retries: 1
  budget_seconds: 12 # 每轮分析总时间上限，超时保留基础提醒
  max_per_run: 20 # API模式仍受总时间预算限制，剩余通知使用基础提醒
  max_input_chars: 6000
  allow_private_cloud: false # 单独授权发送门户标题、截断正文、来源和发布日期
  allow_profile_cloud: false # 独立授权发送结构化画像；默认仅本地匹配
  # profile_path为空时按当前账号作用域存储。禁止指向示例资料。
smart:
  enabled: false # 开启后AI关闭时使用本地规则；重要事项即时，普通按本轮汇总
